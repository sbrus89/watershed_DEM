# Data sources and pipeline configuration for the Upper Chesapeake basin
# (HUC-4 0206, single HUC-6 020600) seamless 1/9 arc-second topobathy DEM.
#
# Pilot for generalizing the DE_watershed_DEM pipeline beyond the Delaware
# basin -- see ~/.claude/plans/iterative-bubbling-kurzweil.md for the plan
# this config implements. Built from the Delaware config (config/sources.yaml
# in the DE_watershed_DEM checkout): most of the pipeline is basin-agnostic
# and reused verbatim; project/, nhdplushr.url, sources.ehydro.district, and
# vdatum.sample_bounds/benchmark_stations are Chesapeake-specific.
#
# All vertical datums are NAVD88 meters unless noted. All endpoints verified
# live in Sep 2026.

project:
  name: chesapeake19
  version: 2026v1
  huc4: "0206"
  # HUC-4 0206 "Upper Chesapeake" is a single HUC-6 (020600) -- no
  # subdivision the way Delaware's 0204 has three. Domain = all of 0206.
  boundary_buffer_m: 2000
  # Coarse pre-filter ONLY, for the TNM API fallback (03_discover_tiles.py).
  # This is not the domain -- do not shrink it to restrict the run; use
  # clip_bbox instead. Basin bounds are W-77.21 S38.03 E-75.58 N39.87
  # (from WBDHU6); widened with margin here.
  bbox: [-77.4, 37.8, -75.3, 40.1]
  # Development clip [W, S, E, N]: restrict the domain to a sub-region.
  # null = the full HUC-4. See run_test_slice.sh for single-tile validation,
  # which does not need this -- it restricts stages 04+ via --tile instead.
  clip_bbox: null

target_grid:
  epsg: 4269                  # NAD83 geographic; audit (stage 02) must confirm
  vertical: "NAVD88 (m)"
  cells_per_degree: 32400     # 1/9 arc-second
  tile_size_deg: 0.25
  nodata: -999999.0
  # collar_px / registration are derived empirically by 02_audit_cudem_grid.py
  # and written to config/tile_grid.json. Do not set them here.

tnm_api:
  base: "https://tnmaccess.nationalmap.gov/api/v1"
  page_size: 200

wbd:
  # Region-02 GPKG already covers every HUC-4 in the Mid-Atlantic, including
  # 0206 -- same file the Delaware checkout uses, no change needed.
  url: "https://prd-tnm.s3.amazonaws.com/StagedProducts/Hydrography/WBD/HU2/GPKG/WBD_02_HU2_GPKG.zip"

nhdplushr:
  # Staged NHDPlus HR GDB for HUC-4 0206 (water-mask polygons). Confirmed
  # live (HTTP 200) 2026-09-15.
  url: "https://prd-tnm.s3.amazonaws.com/StagedProducts/Hydrography/NHDPlusHR/Beta/GDB/NHDPLUS_H_0206_HU4_GDB.zip"
  # Feature classes / FTypes used for the water mask:
  nhdarea_ftypes: [460, 445, 336]      # StreamRiver, SeaOcean, CanalDitch
  nhdwaterbody_ftypes: [390, 436, 493] # LakePond, Reservoir, Estuary
  min_waterbody_m2: 10000              # 1 ha floor for lakes/ponds

sources:
  # ---- land stack (first valid wins, top to bottom) ----
  s1m:
    role: land
    priority: 1
    tnm_dataset: "Seamless 1-m DEM (S1M)"
    dir: data/raw/s1m
    crs_note: "NAD83(2011) UTM 18N expected basin-wide (confirmed: HUC-4 0206 lies entirely within UTM zone 18N, W77.21-W75.58)"
    resampling: average
  dem1m_projects:
    role: land
    priority: 2
    tnm_dataset: "Digital Elevation Model (DEM) 1 meter"
    dir: data/raw/dem1m_projects
    resampling: average
  dem13:
    role: land
    priority: 3
    # 1/3 arc-second seamless; 1-degree tiles, direct S3 pattern.
    url_pattern: "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/{tile}/USGS_13_{tile}.tif"
    dir: data/raw/dem13
    resampling: bilinear

  # ---- water stack (first valid wins, top to bottom) ----
  ehydro:
    role: water
    priority: 1
    feature_server: "https://services7.arcgis.com/n1YM8pTrFmm7L4hs/arcgis/rest/services/eHydro_Survey_Data/FeatureServer/0/query"
    # Baltimore District, not CENAP -- confirmed live 2026-09-15: recent
    # (through Nov 2025) surveys exist under CENAB intersecting this basin.
    district: CENAB
    dir: data/raw/ehydro
    grid_dir: data/intermediate/ehydro_grids
    grid_res_m: 3.0
    # Assumed same USACE convention as CENAP (feet, positive down, MLLW) --
    # standard nationally, but not yet verified against a real CENAB survey's
    # metadata. Override per-survey in manifests/ehydro_overrides.yaml if the
    # audit (convert_raw_depths / check_plausible) flags an exception.
    depth_units: feet
    depth_positive_down: true
    vertical_ref: MLLW
    resampling: bilinear
  eaarlb:
    role: water
    priority: 2
    # Delaware-specific dataset (Hancock NY -> Portland PA lidar bathymetry);
    # kept configured only because dem_pipeline.composite.WATER_SOURCES is a
    # code-level list that always includes "eaarlb" (compose_tile looks it up
    # unconditionally). 03_discover_tiles.py's eaarlb_rows() geo-filters data
    # tiles against the basin polygon, so this basin (nowhere near the Upper
    # Delaware) correctly resolves to zero tile downloads -- only the small
    # always-kept metadata files (FGDC xml, grid index, void polygons) are
    # pulled, and the water stack simply has no eaarlb contribution here.
    doi: "10.5066/P97031JU"
    sciencebase_item: "5f43b4cf82ce4c3d1222d2a5"
    dir: data/raw/eaarlb
    resampling: average
  cudem19:
    role: water
    priority: 3
    # Same NCEI ninth-arcsecond dataset (8483) as Delaware; already includes
    # a chesapeake_bay prefix. Confirmed live 2026-09-15: urllist8483.txt has
    # 60+ tiles in the 38-39N/75-77W band covering this basin.
    s3_prefixes:
      - "https://noaa-nos-coastal-lidar-pds.s3.amazonaws.com/dem/NCEI_ninth_Topobathy_2014_8483/northeast_sandy/"
      - "https://noaa-nos-coastal-lidar-pds.s3.amazonaws.com/dem/NCEI_ninth_Topobathy_2014_8483/chesapeake_bay/"
    bulk_index: "https://coast.noaa.gov/htdata/raster2/elevation/NCEI_ninth_Topobathy_2014_8483/"
    urllist: "https://coast.noaa.gov/htdata/raster2/elevation/NCEI_ninth_Topobathy_2014_8483/urllist8483.txt"
    tileindex_zip: "https://coast.noaa.gov/htdata/raster2/elevation/NCEI_ninth_Topobathy_2014_8483/tileindex_NCEI_ninth_Topobathy_2014.zip"
    dir: data/raw/cudem19
    resampling: near   # already on the target grid
  coned:
    role: water
    priority: 4
    # NJ/DE-specific collection (footprint stops at 41.2N, sources <=2014) --
    # does not apply to the Chesapeake. Left disabled, same posture Delaware
    # itself started with; revisit only if stage 10 QA shows an uncovered
    # water gap the way it did for Delaware on 2026-09-10.
    enabled: false
    bulk_index: "https://coast.noaa.gov/htdata/raster2/elevation/NewJersey_Delaware_Coned_Topobathy_DEM_2015_5040/"
    urllist: "https://coast.noaa.gov/htdata/raster2/elevation/NewJersey_Delaware_Coned_Topobathy_DEM_2015_5040/urllist5040.txt"
    tileindex_zip: "https://noaa-nos-coastal-lidar-pds.s3.amazonaws.com/dem/NewJersey_Delaware_Coned_Topobathy_DEM_2015_5040/tileindex_NewJersey_Delaware_Coned_Topobathy_DEM_2015.zip"
    dir: data/raw/coned
    resampling: average

vdatum:
  # MLLW -> NAVD88 separation, sampled from the VDatum transformation service.
  # See Delaware's config for why the service is authoritative over composing
  # tss/mllw .gtx grids by hand -- same reasoning applies here unchanged.
  service_url: "https://vdatum.noaa.gov/vdatumweb/api/convert"
  # "chesapeak_delaware" is NOAA's actual combined Chesapeake+Delaware Bay
  # VDatum region (confirmed via vdatum.noaa.gov/docs/services.html), not a
  # Delaware-only label -- reused verbatim. Live-tested 2026-09-15 near
  # Baltimore (-76.4783, 39.2667): returns a plausible separation (-0.283 m,
  # 0.093 m uncertainty) and correctly rejects NAD83_2011 as source frame
  # ("Source Horizontal Frame should be IGS14 for Tidal"), same as Delaware.
  region: chesapeak_delaware
  source_h_frame: IGS14
  target_h_frame: NAD83_2011
  geoid: geoid18
  # Sampling grid [W, S, E, N] -- the Upper Chesapeake's tidal reach, rounded
  # outward from the benchmark stations below (mouth near Hooper Strait
  # 38.22N to the C&D Canal / Chesapeake City 39.53N), NOT the full basin
  # bbox above (most of the watershed is non-tidal upland). Narrower than
  # Delaware's own sample_bounds for the same reason Delaware's was narrower
  # than its HUC-4 bbox. Revisit if the interpolated separation raster looks
  # under-resolved once built.
  sample_bounds: [-76.7, 38.1, -75.6, 39.6]
  sample_spacing_deg: 0.05    # ~5 km; matches Delaware's choice for a smooth field
  sep_res_deg: 0.005          # ~500 m output raster
  sample_cache: manifests/vdatum_samples.csv
  service_workers: 4          # be polite to NOAA
  # Raster value = elevation of MLLW surface relative to NAVD88 (m);
  # z_navd88 = z_mllw + value.
  sep_raster: data/intermediate/mllw_sep/sep_mllw_minus_navd88.tif
  # NOAA CO-OPS stations used to sign/magnitude-verify the separation raster.
  # All 8 confirmed live 2026-09-15 to publish both MLLW and NAVD88 datums,
  # spanning mouth (Hooper Strait) to the C&D Canal near the head of tide.
  # Delaware needed 11 to separate a real outlier from a systematic trend;
  # start with 8 here and extend (candidates were sparse -- many nearby
  # stations publish MLLW only, no NAVD88) if the benchmark gate's residuals
  # don't cleanly separate a bad build from noise.
  benchmark_stations:
    - "8571421"   # Bishops Head, Hooper Strait   38.220
    - "8577330"   # Solomons Island               38.317
    - "8571579"   # Barren Island                 38.342
    - "8571892"   # Cambridge                     38.572
    - "8575512"   # Annapolis (US Naval Academy)  38.984
    - "8573364"   # Tolchester Beach              39.213
    - "8574680"   # Baltimore, Fort McHenry       39.267
    - "8573927"   # Chesapeake City, Maryland     39.527
  datums_api: "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/{station}/datums.json"
  station_api: "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/{station}.json"
  # Same tolerance and rationale as Delaware: set against the service's own
  # published uncertainty, not preference.
  max_benchmark_residual_m: 0.10

compositing:
  feather_px: 15          # land/water EDT feather width (~45 m at 1/9")
  survey_feather_px: 8    # feather at eHydro/EAARL footprint edges within water
  fill_max_px: 50         # max search radius for residual nodata fill
  source_ids:             # per-pixel provenance raster values
    nodata: 0
    s1m: 1
    dem1m_projects: 2
    dem13: 3
    ehydro: 11
    eaarlb: 12
    cudem19: 13
    coned: 14
    filled: 99

output:
  tile_dir: data/final/tiles
  vrt: data/final/chesapeake19_2026v1.vrt
  cog:
    compress: DEFLATE
    predictor: 3
    blocksize: 512
    overview_resampling: AVERAGE

download:
  workers: 8
  retries: 5
  timeout_s: 120

qa:
  dir: data/final/qa
  quicklook_dir: data/final/quicklooks
  land_overlap_median_max_m: 0.10
  seam_gradient_flag_m: 5.0
