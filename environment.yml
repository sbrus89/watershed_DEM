name: de-dem
channels:
  - conda-forge
dependencies:
  - python=3.12
  - gdal>=3.8
  - libgdal-core
  - rasterio
  - rioxarray
  - geopandas
  - shapely>=2
  - pyproj
  - xarray
  - scipy
  - scikit-image          # channel burn (least-cost path, depression fill)
  - requests
  - tqdm
  - pyyaml
  - matplotlib-base
  - cmocean
  - fiona
  - pyogrio
  - pytest
  - pip
  - pip:
      - -e .
